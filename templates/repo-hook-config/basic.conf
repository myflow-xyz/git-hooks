# Basic repo-local Git hook policy.
#
# Copy this file to:
#   $REPO/.githooks/project.conf
#
# Then enable repo-local hooks:
#   git config --local core.hooksPath .githooks

GIT_HOOK_PROFILES="common"
# Example for pnpm-based React/Vite projects:
# GIT_HOOK_PROFILES="common react-vite"
# Example for Go projects:
# GIT_HOOK_PROFILES="common golang"
# Example for Python projects:
# GIT_HOOK_PROFILES="common python"

# Optional extra checks. Omit empty variables.
# GIT_HOOK_PRE_COMMIT_EXTRA_CHECKS="frontend/oxfmt frontend/oxlint"
# GIT_HOOK_PRE_PUSH_EXTRA_CHECKS="frontend/vitest"
# GIT_HOOK_PRE_PUSH_EXTRA_CHECKS="python/pytest-cov python/pip-audit"

# Optional Python runner policy.
# GIT_HOOK_PYTHON_RUNNER=auto
# GIT_HOOK_PYTHON_UV_ARGS="--frozen"
